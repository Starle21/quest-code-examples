<!DOCTYPE html>
<html>
  <head>
    <title>Single Source</title>
    <meta charset="utf-8" />
    <style>
      svg {
        border: 1px solid black;
      }
      .small {
        font: 9px sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- network button -->
    <button>request remote data once</button>

    <!-- inputs -->
    <div class="squareInputs">
      <div>Give me</div>
      <div>x coordinate</div>
      <input id="xCoord" />
      <div>y coordinate</div>
      <input id="yCoord" />
      <div>side length</div>
      <input id="side" />
      <div>and I'll draw a square for you</div>
    </div>

    <!-- svg with text or rect -->
    <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="40" class="small">Fill out all inputs!</text>
    </svg>

    <!-- coordinates -->
    <div class="coordinates"></div>

    <script src="bundle.js"></script>
  </body>
</html>
